<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <!-- Une démo pour les partenaires : elle n’a rien à faire dans les moteurs de recherche. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Nom de la boutique</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/permanent-marker.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex min-h-dvh flex-col" data-page="etal" x-data="etal" :class="vue === 'pastel' && 'vue-pastel'">
  <header class="site bords-surs">
    <div class="relative flex h-16 items-center justify-center px-14 lg:h-20">
    <a href="index.html" data-retour class="absolute top-1/2 left-1 grid size-11 -translate-y-1/2 place-items-center md:left-3" aria-label="Retour" x-show="mode === 'modele'" x-cloak>
      <svg class="trait size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <h1><a href="index.html" class="marque" :class="vue === 'pastel' && 'marque--serif'" x-text="$store.boutique.nom">Nom de la boutique</a></h1>
  </div>
  </header>

  <main class="site bords-surs flex-1">
    <!-- Les résultats d’une recherche : le champ, les rayons trouvés, le tri. -->
    <template x-if="mode === 'recherche'">
      <div class="mx-auto max-w-[960px] px-4 pt-2 pb-8 md:px-6 lg:px-0">
        <form role="search" class="champ-recherche" @submit.prevent>
          <svg class="trait size-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input type="search" name="q" x-model.debounce.150ms="q" x-ref="champ" aria-label="Tu cherches quoi ?" placeholder="Tu cherches quoi ?" autocomplete="off" enterkeyhint="search">
          <button type="button" class="grid size-11 shrink-0 place-items-center rounded-full hover:bg-fond-doux" aria-label="Effacer la recherche" x-show="q" @click="effacerRecherche()">
            <svg class="trait size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </form>

        <p class="mt-6 flex flex-wrap items-baseline gap-x-2" aria-live="polite">
          <span class="titre-main text-[28px] lg:text-[32px]" x-text="nombre"></span>
          <span class="text-encre-douce" x-show="q" x-text="'pour « ' + q + ' »'"></span>
        </p>

        <div class="mt-5 flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
          <div role="group" aria-label="Rayon" class="flex flex-wrap gap-2" x-show="trouvees.length">
            <template x-for="r in rayonsTrouves" :key="r.slug">
              <button type="button" class="puce-claire" :aria-pressed="String(parmi === r.slug)" @click="parmi = r.slug">
                <span x-text="r.nom"></span> <span class="compte" x-text="r.n"></span>
              </button>
            </template>
          </div>
          <label class="tri md:ml-auto" x-show="trouvees.length">
            <svg class="trait size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16m0 0-3.5-3.5M8 20l3.5-3.5M16 20V4m0 0-3.5 3.5M16 4l3.5 3.5"/></svg>
            <span class="tri-mot">Trier&nbsp;:</span>
            <span class="tri-choix">
              <span class="tri-mot" x-text="triNom"></span>
              <select x-model="tri" aria-label="Trier">
                <template x-for="t in tris" :key="t.code"><option :value="t.code" x-text="t.nom" :selected="t.code === tri"></option></template>
              </select>
            </span>
          </label>
        </div>

        <p class="mt-8 text-encre-douce" x-show="!pieces.length" x-cloak>
          Rien sur l’étal pour ça. Essaie «&nbsp;wax&nbsp;», «&nbsp;jean&nbsp;» ou «&nbsp;baskets&nbsp;».
        </p>
      </div>
    </template>

    <!-- Un rayon, les nouveautés ou tout l’étal : titre, Pour qui, onglets, filtres, tri. -->
    <template x-if="mode === 'rayon'">
      <div class="mx-auto max-w-[960px] px-4 pt-2 pb-8 md:px-6 lg:px-0">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <h2 class="titre-main origin-left text-[44px] leading-none lg:text-[60px]" x-text="titre"></h2>
          <div role="group" aria-label="Pour qui" class="flex flex-wrap gap-2">
            <template x-for="o in publics" :key="o.code">
              <button type="button" class="puce-claire" :aria-pressed="String(public === o.code)" @click="public = o.code" x-text="o.nom"></button>
            </template>
          </div>
        </div>

        <nav aria-label="Rayons" class="onglets mt-5 lg:mt-7">
          <template x-for="o in onglets" :key="o.nom">
            <a :href="o.href" :aria-current="o.actif ? 'page' : null" x-text="o.nom"></a>
          </template>
        </nav>

        <div class="mt-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <p class="flex items-baseline gap-2" aria-live="polite">
            <span class="titre-main text-[28px] lg:text-[32px]" x-text="nombre"></span>
            <span class="text-encre-douce md:text-lg">uniques</span>
          </p>
          <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
            <button type="button" class="bouton-filtres" aria-haspopup="dialog" :aria-expanded="String($store.ui.panneau === 'filtres')" @click="$store.ui.basculer('filtres', $el)">
              <svg class="trait size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9m4 0h3M4 16h3m4 0h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
              Filtres
              <span class="grid size-5 place-items-center rounded-full bg-encre text-[11px] text-white" x-show="$store.filtres.nombre" x-text="$store.filtres.nombre"></span>
            </button>
            <label class="tri">
              <svg class="trait size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16m0 0-3.5-3.5M8 20l3.5-3.5M16 20V4m0 0-3.5 3.5M16 4l3.5 3.5"/></svg>
              <span class="tri-mot">Trier&nbsp;:</span>
              <span class="tri-choix">
                <span class="tri-mot" x-text="triNom"></span>
                <select x-model="tri" aria-label="Trier">
                  <template x-for="t in tris" :key="t.code"><option :value="t.code" x-text="t.nom" :selected="t.code === tri"></option></template>
                </select>
              </span>
            </label>
          </div>
        </div>

        <p class="mt-8 text-encre-douce" x-show="!pieces.length" x-cloak>
          Rien ici pour l’instant.
          <button type="button" class="font-semibold underline underline-offset-4" x-show="$store.filtres.nombre" @click="$store.filtres.effacer()">Effacer les filtres</button>
        </p>
      </div>
    </template>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
      :class="vue === 'pastel' ? 'etal--pastel gap-2.5 px-2.5 pb-10 lg:gap-3 lg:px-8' : 'etal--blanc gap-x-1 gap-y-6 px-2 pb-10 md:gap-y-8 lg:px-4'">
      <template x-for="(p, i) in pieces" :key="p.cle ?? p.slug">
        <a class="case" :href="lien(p)" :style="{ '--case': teinte(i) }">
          <div class="case-image">
            <img class="article" :src="p.image" :alt="p.coloris ? p.nom + ', ' + p.coloris.nom.toLowerCase() : p.nom" width="640" height="640" :loading="i < 8 ? 'eager' : 'lazy'">
            <span class="etiquette etiquette--case" :class="'place-' + p.etiquette.place + (i % 2 ? ' etiquette--b' : '')" :style="{ '--incl': p.etiquette.incl + 'deg' }">
              <span class="etiquette-papier">
                <s class="etiquette-avant" x-show="p.avant" x-text="p.avant && $fcfa(p.avant)"></s><span x-text="prixEtiquette(p)"></span>
                <span class="etiquette-mot" x-show="p.mot" x-text="p.mot"></span>
              </span>
            </span>
          </div>
          <p class="case-libelle" x-text="p.nom"></p>
          <p class="case-numero" x-text="'N° ' + p.numero"></p>
        </a>
      </template>
    </div>

    <div class="pastille-ancre" id="pastille"></div>
  </main>

  <footer class="pied" id="pied"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="vendor/alpine.min.js" defer></script>
</body>
</html>
